name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # GitHub web uploads overwrite files but cannot remove an obsolete file.
      # Ignore the known V10 loop test until the one-shot cleanup commits its deletion.
      - name: Ignore obsolete V10 test during migration
        run: rm -f -- tests/test_pipeline_loop.py
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: python main.py validate
      - run: ruff check .
      - run: python -m unittest discover -s tests -v
