name: Refresh verified endpoints

on:
  workflow_dispatch:
  schedule:
    # Avoid minute 0, when scheduled Actions have the highest queue pressure.
    - cron: "17 */6 * * *"

permissions: {}

concurrency:
  group: noode-cg-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    env:
      NOODE_VANTAGE: github-general
      NOODE_RUN_SEED: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python main.py validate
      - run: python main.py run
      - name: Commit changed outputs
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- output data/previous-top100.json data/previous-official-ips.txt)" ]; then
            echo "No output changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- output data/previous-top100.json data/previous-official-ips.txt
          if git diff --cached --quiet; then
            echo "No staged changes"
            exit 0
          fi
          git commit -m "chore(data): refresh verified endpoints [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
