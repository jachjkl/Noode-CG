name: Cloud RAW10000 to local TOP300

on:
  workflow_dispatch:
    inputs:
      continuation:
        description: Continue an unfinished local TOP300 cycle
        required: false
        default: false
        type: boolean
permissions: {}

concurrency:
  group: noode-cg-cloud-local-refresh
  cancel-in-progress: false

jobs:
  cloud-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      handoff_sha256: ${{ steps.handoff-hash.outputs.sha256 }}
      handoff_ref: ${{ steps.handoff-commit.outputs.ref }}
    permissions:
      contents: write
    env:
      NOODE_VANTAGE: github-cloud-prepare
      NOODE_RUN_SEED: ${{ github.run_id }}-${{ github.run_attempt }}
      NOODE_CONTINUATION: ${{ inputs.continuation || 'false' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: python main.py validate
      - run: python main.py prepare-handoff
      - name: Export trusted handoff SHA-256
        id: handoff-hash
        shell: bash
        run: echo "sha256=$(sha256sum data/handoff/cloud-raw10000.json.gz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Commit cloud handoff only
        id: handoff-commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            data/handoff/cloud-raw10000.json.gz \
            data/handoff/cloud-health.json \
            data/previous-official-ips.txt.gz
          for optional in \
            data/handoff/local-qualified.json.gz \
            data/handoff/local-attempted-ips.txt.gz; do
            if [ -e "$optional" ] || git ls-files --error-unmatch -- "$optional" >/dev/null 2>&1; then
              git add -A -- "$optional"
            fi
          done
          if git diff --cached --quiet; then
            echo "Cloud handoff unchanged"
          else
            git commit -m "chore(data): prepare cloud RAW10000 [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  local-select:
    needs: cloud-prepare
    runs-on: [self-hosted, windows, x64, noode-cg]
    timeout-minutes: 240
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"
        working-directory: 'D:\桌面\软件\Noode-CG-Local\app'
    permissions: {}
    outputs:
      needs_more: ${{ steps.local-status.outputs.needs_more }}
      result_sha256: ${{ steps.local-status.outputs.result_sha256 }}
      result_payload_0: ${{ steps.local-status.outputs.result_payload_0 }}
      result_payload_1: ${{ steps.local-status.outputs.result_payload_1 }}
      result_payload_2: ${{ steps.local-status.outputs.result_payload_2 }}
      result_payload_3: ${{ steps.local-status.outputs.result_payload_3 }}
      result_payload_4: ${{ steps.local-status.outputs.result_payload_4 }}
      result_payload_5: ${{ steps.local-status.outputs.result_payload_5 }}
    env:
      NOODE_VANTAGE: windows-self-hosted-local-network
      NOODE_LOCAL_ROOT: D:\桌面\软件\Noode-CG-Local
      PSExecutionPolicyPreference: Bypass
    steps:
      - name: Validate the installed local application
        run: |
          $version = (Get-Content -Raw -LiteralPath "VERSION").Trim()
          if ($version -ne "13.6.2") {
            throw "Local application version $version is not 13.6.2. Re-run scripts\install-windows-controller.ps1 from the V13.6.2 package."
          }
          Write-Host "Local application V$version is ready; no GitHub checkout is required."
      - name: Use the Runner-local Python runtime
        run: |
          $python = Join-Path $env:NOODE_LOCAL_ROOT "runtime\python\python.exe"
          if (-not (Test-Path -LiteralPath $python)) {
            throw "Runner Python is missing at $python. Re-run scripts\install-windows-controller.ps1."
          }
          & $python --version
          if ($LASTEXITCODE -ne 0) { throw "Runner Python failed to start" }
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_ENV, "NOODE_PYTHON=$python`n", $utf8)
      - name: Verify Python requirements in the Runner-local runtime
        run: |
          & $env:NOODE_PYTHON -c "import yaml; print('Runner Python dependencies are ready')"
          if ($LASTEXITCODE -ne 0) {
            throw "Runner Python dependencies are missing. Re-run scripts\install-windows-controller.ps1."
          }
      - name: Restore a result saved during an earlier cloud publish outage
        run: |
          $manifest = Join-Path $env:NOODE_LOCAL_ROOT "pending-publish\manifest.json"
          if (-not (Test-Path -LiteralPath $manifest)) {
            Write-Host "No pending local result"
            exit 0
          }
          ./scripts/local-runtime.ps1 -Mode Restore
          Write-Host "Pending result restored and will be included in this cloud publish payload."
      - name: Validate or download cloud handoff through checked mirrors
        run: ./scripts/sync-cloud-handoff.ps1 -ExpectedSha256 "${{ needs.cloud-prepare.outputs.handoff_sha256 }}" -Branch "${{ needs.cloud-prepare.outputs.handoff_ref }}"
      - name: Require direct local network
        run: ./scripts/assert-direct-network.ps1
      - name: Validate configuration
        run: |
          & $env:NOODE_PYTHON main.py validate
          if ($LASTEXITCODE -ne 0) { throw "Configuration validation failed" }
      - name: Run local selection
        run: |
          & $env:NOODE_PYTHON main.py local-select
          if ($LASTEXITCODE -ne 0) { throw "Local selection failed" }
      - name: Encode bounded local result for cloud publish
        id: local-status
        run: |
          $health = Get-Content -Raw -Encoding UTF8 -LiteralPath "output/health.json" | ConvertFrom-Json
          $needsMore = [bool]$health.needs_more
          ./scripts/local-runtime.ps1 -Mode Save
          $archive = Join-Path $env:RUNNER_TEMP "noode-local-result-$env:GITHUB_RUN_ID.zip"
          if (Test-Path -LiteralPath $archive) { Remove-Item -LiteralPath $archive -Force }
          & $env:NOODE_PYTHON scripts/result_payload.py pack --root . --archive $archive
          if ($LASTEXITCODE -ne 0) { throw "Local result payload creation failed" }
          $payload = [Convert]::ToBase64String([IO.File]::ReadAllBytes($archive))
          if ($payload.Length -gt 450000) {
            throw "Local result payload is too large for the Runner control channel: $($payload.Length) characters"
          }
          $sha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          $utf8 = New-Object Text.UTF8Encoding($false)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "needs_more=$($needsMore.ToString().ToLowerInvariant())`n", $utf8)
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "result_sha256=$sha256`n", $utf8)
          $chunkSize = 75000
          for ($index = 0; $index -lt 6; $index++) {
            $offset = $index * $chunkSize
            $chunk = if ($offset -lt $payload.Length) {
              $payload.Substring($offset, [Math]::Min($chunkSize, $payload.Length - $offset))
            } else { "" }
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "result_payload_$index=$chunk`n", $utf8)
          }
          Write-Host "Local selected=$($health.counts.final_selected)/$($health.counts.final_target), payload=$($payload.Length) chars, needs_more=$needsMore"
      - name: Notify Windows user that cloud publish is starting
        continue-on-error: true
        run: |
          $health = Get-Content -Raw -Encoding UTF8 -LiteralPath "output/health.json" | ConvertFrom-Json
          if ([bool]$health.published) {
            $newCount = [int]$health.counts.ordinary_replacements
            $finalCount = [int]$health.counts.final_selected
            ./scripts/notify-user.ps1 -Title "Noode-CG 本地优选已完成" -Message "本轮新增 $newCount 个普通IP，合并后 $finalCount 个节点已交给Ubuntu云端发布。"
          } else {
            $qualified = [int]$health.counts.qualified_accumulated
            $target = [int]$health.counts.general_target
            ./scripts/notify-user.ps1 -Title "Noode-CG 正在继续补池" -Message "当前累计合格 $qualified/$target，结果将由云端保存后生成下一批10000个官方候选。"
          }

  cloud-publish:
    needs: [cloud-prepare, local-select]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - name: Decode, verify and apply the local result
        shell: bash
        run: |
          payload_b64="$RUNNER_TEMP/noode-local-result.b64"
          payload_zip="$RUNNER_TEMP/noode-local-result.zip"
          cat > "$payload_b64" <<'NOODE_PAYLOAD'
          ${{ needs.local-select.outputs.result_payload_0 }}${{ needs.local-select.outputs.result_payload_1 }}${{ needs.local-select.outputs.result_payload_2 }}${{ needs.local-select.outputs.result_payload_3 }}${{ needs.local-select.outputs.result_payload_4 }}${{ needs.local-select.outputs.result_payload_5 }}
          NOODE_PAYLOAD
          tr -d '\r\n ' < "$payload_b64" | base64 --decode > "$payload_zip"
          echo "${{ needs.local-select.outputs.result_sha256 }}  $payload_zip" | sha256sum --check --strict
          python3 scripts/result_payload.py unpack --archive "$payload_zip" --destination .
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open("output/health.json", encoding="utf-8")).get("published") else 1)'; then
            rm -f data/handoff/local-qualified.json.gz data/handoff/local-attempted-ips.txt.gz
            echo "Published result: cleared completed accumulator state"
          fi
      - name: Publish local result from Ubuntu
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            output \
            data/previous-top100.json \
            data/handoff/local-qualified.json.gz \
            data/handoff/local-attempted-ips.txt.gz
          if git diff --cached --quiet; then
            echo "Local result unchanged"
            exit 0
          fi
          git commit -m "chore(data): publish local network result [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  local-cleanup:
    needs: cloud-publish
    runs-on: [self-hosted, windows, x64, noode-cg]
    timeout-minutes: 10
    permissions: {}
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -File "{0}"
        working-directory: 'D:\桌面\软件\Noode-CG-Local\app'
    env:
      NOODE_LOCAL_ROOT: D:\桌面\软件\Noode-CG-Local
    steps:
      - name: Notify successful cloud publication
        continue-on-error: true
        run: |
          $health = Get-Content -Raw -Encoding UTF8 -LiteralPath "output/health.json" | ConvertFrom-Json
          if ([bool]$health.published) {
            $newCount = [int]$health.counts.ordinary_replacements
            $finalCount = [int]$health.counts.final_selected
            ./scripts/notify-user.ps1 -Title "Noode-CG 优选已完成" -Message "本轮新增 $newCount 个普通IP，合并后的 $finalCount 个节点已发布到GitHub。"
          } else {
            ./scripts/notify-user.ps1 -Title "Noode-CG 本轮结果已保存" -Message "合格结果已由Ubuntu保存，准备继续补池。"
          }
      - name: Clear local pending data, logs and caches
        continue-on-error: true
        run: |
          ./scripts/local-runtime.ps1 -Mode ClearPending
          ./scripts/local-runtime.ps1 -Mode ClearRuntime

  replenish-cloud-pool:
    needs: [local-select, cloud-publish, local-cleanup]
    if: needs.local-select.outputs.needs_more == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch a fresh disjoint cloud RAW10000
        run: gh workflow run update.yml --repo "${GITHUB_REPOSITORY}" --ref "${GITHUB_REF_NAME}" -f continuation=true
