name: Refresh verified endpoints

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: noode-cg-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NOODE_VANTAGE: github-general
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python main.py validate
      - run: python main.py run
      - name: Commit changed outputs
        shell: bash
        run: |
          if git diff --quiet -- output data/sources/zip-cm-edu-kg-all.txt; then
            echo "No output changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output data/sources/zip-cm-edu-kg-all.txt
          git commit -m "chore(data): refresh verified endpoints"
          git push
