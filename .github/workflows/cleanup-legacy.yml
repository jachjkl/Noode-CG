name: Cleanup obsolete files

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: noode-cg-refresh
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Remove obsolete files
        shell: bash
        run: |
          obsolete=(
            core/history.py
            core/selection.py
            core/sharding.py
            docs/platform-probe.example.json
            tests/test_history.py
            tests/test_http_stability.py
            tests/test_platform_policy.py
            tests/test_selection.py
            tests/test_sharding.py
            tests/test_tcp_stability.py
            tests/test_scorer.py
            core/scorer.py
            core/selection_v3.py
            tests/test_selection_v3.py
            data/stability-history.json
            data/sources/vps789-cfip.json
            data/sources/ymyuuu-bestcfv4.txt
            data/sources/bestcf-cmliu.txt
            data/sources/bestcf-cmliu2.txt
            data/sources/hubbylei-bestcf.txt
            data/input/ALL-2026-08-22.txt
            data/input/ip.zip
            Noode-CG.zip
            Noode-CG-V2-JP10.zip
            Noode-CG-V2-JP10-R100.zip
            Noode-CG-V2-JP10-R100-Dynamic.zip
            Noode-CG-V3-Rolling300.zip
            Noode-CG-V4-Strict500.zip
            Noode-CG-V5-ThreeMetrics5000.zip
          )
          for path in "${obsolete[@]}"; do
            if [ -e "$path" ]; then
              git rm -f -- "$path"
            fi
          done
          git rm -f -- .github/workflows/cleanup-legacy.yml
          if git diff --cached --quiet; then
            echo "No obsolete files found"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove obsolete files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
