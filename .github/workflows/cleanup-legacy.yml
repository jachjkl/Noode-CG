name: Cleanup obsolete V2.3 files

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: noode-cg-refresh
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - name: Remove obsolete V2.3 files
        shell: bash
        run: |
          obsolete=(
            core/history.py
            core/selection.py
            core/sharding.py
            docs/platform-probe.example.json
            tests/test_history.py
            tests/test_http_stability.py
            tests/test_platform_policy.py
            tests/test_selection.py
            tests/test_sharding.py
            tests/test_tcp_stability.py
          )
          for path in "${obsolete[@]}"; do
            if [ -e "$path" ]; then
              git rm -f -- "$path"
            fi
          done
          git rm -f -- .github/workflows/cleanup-legacy.yml
          if git diff --cached --quiet; then
            echo "No obsolete files found"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove obsolete V2.3 files"
          git push origin "HEAD:${GITHUB_REF_NAME}"
