project:
  name: Noode-CG V9-ThreePassJP15
  # TLS SNI and HTTP Host. Change this to the domain bound to your edgetunnel Worker.
  target_domain: jackoyu.dpdns.org
  user_agent: Noode-CG/9.0-three-pass-jp15

paths:
  locations: data/locations.json
  checkpoints: data/checkpoints
  output: output

rolling:
  # Save the previous published TOP100, then retest them together with the
  # current TOP500 before publishing the final TOP500.
  previous_limit: 100
  snapshot_path: data/previous-top100.json
  official_snapshot_path: data/previous-official-ips.txt

sources:
  local: []
  # Every valid entry from every link is included. Link entries do not consume
  # any of the 50,000 official-range slots sampled in each round.
  remote:
    - name: zip.cm.edu.kg/all.txt
      url: https://zip.cm.edu.kg/all.txt
      required: true
      min_records: 10000
      retries: 3
      retry_delay_seconds: 2
      timeout_seconds: 30
      default_port: 443
    - name: bestcf.pages.dev/lzj
      url: https://bestcf.pages.dev/lzj/all.txt
      required: true
      min_records: 50
      retries: 3
      retry_delay_seconds: 2
      timeout_seconds: 30
      default_port: 443
  max_download_bytes: 20971520
  cloudflare_ranges:
    enabled: true
    refresh: true
    ipv4_url: https://www.cloudflare.com/ips-v4/
    include_ipv6: false
    ipv6_url: https://www.cloudflare.com/ips-v6/
    official_batch_size: 50000
    ports: [443]
    # GitHub supplies a different run id/attempt each time. Local runs leave
    # this empty and use the current nanosecond timestamp.
    sampling_seed: ${NOODE_RUN_SEED:-}

pipeline:
  # This target counts only IPs that pass TCP, TLS, and HTTPS TTFB below.
  three_metric_shortlist: 5000
  maximum_combined_latency_ms: 300
  maximum_component_latency_ms: 300
  maximum_jitter_ms: 200
  current_selection: 500
  speed_batch_size: 1000
  # Final verification takes up to 800 never-before-retested current nodes at
  # once and accumulates successes. A node and previous TOP100 entry are not
  # tested repeatedly in later final-verification rounds.
  rolling_candidate_batch: 800
  max_runtime_seconds: 19800
  minimum_round_budget_seconds: 900
  postprocess_reserve_seconds: 6000
  fail_on_quality_gate: false

  # Three consecutive TCPing attempts run over the entire source + 50,000
  # official batch. Only the fastest candidates continue to TLS/HTTPS.
  strict_tcp_candidates_per_round: 10000

  country_minimums:
    JP: 15
  speed_country_reserve:
    JP: 60

  tcp:
    concurrency: 400
    timeout_seconds: 1.0
    attempts: 3
    require_all_attempts: true
    maximum_average_latency_ms: 200
    maximum_jitter_ms: 200
    stop_on_failure: true
    stop_when_average_impossible: true

  tls:
    concurrency: 150
    timeout_seconds: 4.0
    verify_certificate: true
    minimum_version: TLSv1.2
    attempts: 3
    require_all_attempts: true
    maximum_average_latency_ms: 300
    maximum_jitter_ms: 200
    stop_on_failure: true
    stop_when_average_impossible: true

  http:
    concurrency: 100
    timeout_seconds: 5.0
    path: /cdn-cgi/trace
    require_trace_fields: true
    accepted_statuses: [200]
    attempts: 3
    require_all_attempts: true
    maximum_average_ttfb_ms: 300
    maximum_jitter_ms: 200
    stop_on_failure: true
    stop_when_average_impossible: true

  websocket:
    # Enable only after setting the exact path used by your Worker.
    enabled: false
    path: /
    concurrency: 100
    timeout_seconds: 5.0

  speed:
    enabled: true
    domain: speed.cloudflare.com
    # One 256 KiB response is required. Results below 1 Mbps are excluded.
    path: /__down?bytes=262144
    bytes_per_test: 262144
    minimum_completion_ratio: 0.95
    candidates: 1000
    minimum_mbps: 1.0
    concurrency: 48
    timeout_seconds: 5.0
    maximum_download_seconds: 4.5

  rolling_retest:
    concurrency: 200
    timeout_seconds: 1.0
    attempts: 3
    require_all_attempts: true
    maximum_average_latency_ms: 200
    maximum_jitter_ms: 200
    stop_on_failure: true
    stop_when_average_impossible: true

  location_filter:
    require_known_endpoint_country: true
    require_known_colo_country: true
    excluded_countries: [CN]

output:
  top_nodes: 500
  minimum_publish: 500
  preserve_last_good: true
  node_label: country
  write_compatibility_zip: true

vantage:
  # A GitHub-hosted runner is only one network vantage point. For genuine
  # CT/CU/CM measurements, run the same command on self-hosted runners and
  # merge their data under data/probes/.
  name: ${NOODE_VANTAGE:-github-general}
  probe_files: []

network_baseline:
  # These are whole-run diagnostics from the GitHub runner, not fake
  # per-candidate proxy tests. Candidate ranking uses TCP/TLS/Worker HTTP.
  attempts: 3
  timeout_seconds: 10
  targets:
    - name: Google
      url: https://www.google.com/generate_204
    - name: Cloudflare
      url: https://www.cloudflare.com/cdn-cgi/trace
    - name: GitHub
      url: https://github.com/
