project:
  name: Noode-CG V2.2
  # TLS SNI and HTTP Host. Change this to the domain bound to your edgetunnel Worker.
  target_domain: jackoyu.dpdns.org
  user_agent: Noode-CG/2.2

paths:
  locations: data/locations.json
  checkpoints: data/checkpoints
  history: data/stability-history.json
  output: output

sources:
  local:
    - data/input/ALL-2026-08-22.txt
    - data/input/ip.zip
  # This required source is refreshed on every run. All valid entries are kept
  # in every scan batch before official ranges fill the logical pool to 100,000 IPs.
  # If the service is temporarily unavailable, the last committed cache is used.
  remote:
    - name: zip.cm.edu.kg/all.txt
      url: https://zip.cm.edu.kg/all.txt
      required: true
      min_records: 10000
      min_ratio_to_cache: 0.80
      retries: 3
      retry_delay_seconds: 2
      timeout_seconds: 30
      default_port: 443
      cache_path: data/sources/zip-cm-edu-kg-all.txt
    # Privacy-safe, optional three-network reference. It sends no domain, UUID,
    # path or subscription data. Stale/unavailable data is skipped automatically.
    - name: vps789-three-network
      url: https://vps789.com/public/sum/cfIpApi
      format: vps789
      required: false
      max_age_days: 7
      min_records: 1
      retries: 2
      retry_delay_seconds: 2
      timeout_seconds: 20
      default_port: 443
      cache_path: data/sources/vps789-cfip.json
  max_download_bytes: 20971520
  cloudflare_ranges:
    enabled: true
    refresh: true
    ipv4_url: https://www.cloudflare.com/ips-v4/
    ipv4_fallback: data/cloudflare-ipv4.txt
    include_ipv6: false
    ipv6_url: https://www.cloudflare.com/ips-v6/
    ipv6_fallback: data/cloudflare-ipv6.txt
    target_pool: 100000
    ports: [443]
    deterministic_seed: 20260822

pipeline:
  # These are observable quality gates, not promises. A run never fabricates
  # unverified endpoints merely to hit a count.
  min_pool: 100000
  min_tcp_alive: 30000
  min_tls_valid: 100
  min_http_valid: 50
  min_stable_valid: 50
  min_speed_qualified: 50
  fail_on_quality_gate: false

  # GitHub scans 50,000 endpoints per scheduled run. Required sources and nodes
  # with history are always included; official-range samples rotate across three
  # deterministic shards, covering the 100,000 pool within at most 18 hours.
  scan:
    limit: 50000
    shards: 3
    window_hours: 6

  tcp:
    # Broad pass: only reject closed/unreachable endpoints. Accuracy comes from
    # the low-concurrency stability pass below.
    concurrency: 400
    timeout_seconds: 1.5
    attempts: 1

  tls:
    concurrency: 200
    timeout_seconds: 4.0
    verify_certificate: true
    minimum_version: TLSv1.2

  http:
    concurrency: 150
    timeout_seconds: 5.0
    path: /cdn-cgi/trace
    require_trace_fields: true
    accepted_statuses: [200]

  stability:
    enabled: true
    # Same idea as CFData's result limit: only precisely re-test the best
    # initial HTTP results so the scheduled job stays within its time budget.
    candidates: 2000
    tcp:
      concurrency: 120
      timeout_seconds: 2.0
      attempts: 5
      minimum_success_ratio: 0.80
      maximum_p95_ms: 500
    http:
      concurrency: 60
      timeout_seconds: 6.0
      attempts: 3
      minimum_success_ratio: 1.0
      maximum_p95_ms: 1500
      path: /cdn-cgi/trace
      require_trace_fields: true
      accepted_statuses: [200]

  history:
    # 4 runs/day * 7 days. New nodes start near neutral and earn trust across runs.
    window_runs: 28
    neutral_prior_runs: 4
    max_missed_runs: 56

  websocket:
    # Enable only after setting the exact path used by your Worker.
    enabled: false
    path: /
    concurrency: 100
    timeout_seconds: 5.0

  speed:
    enabled: true
    require_for_publish: true
    domain: speed.cloudflare.com
    path: /__down?bytes=2097152
    bytes_per_test: 2097152
    candidates: 600
    batch_size: 100
    target_qualified: 330
    # CFData recommends very low concurrency for accurate speed tests. Three
    # workers keep GitHub Actions within its time budget without 8-way contention.
    concurrency: 3
    timeout_seconds: 10.0
    minimum_mbps: 4.0
    minimum_completion_ratio: 0.98

score:
  weights:
    latency: 0.18
    p95: 0.13
    jitter: 0.09
    loss: 0.14
    speed: 0.15
    completion: 0.10
    history: 0.10
    protocol: 0.05
    region: 0.03
    external: 0.03
  caps:
    latency_ms: 500
    p95_latency_ms: 800
    jitter_ms: 150
    speed_mbps: 80
  region_priority:
    JP: 1.00
    KR: 0.95
    SG: 0.95
    HK: 0.85
    TW: 0.80
    US: 0.60
  default_region_score: 0.50

output:
  top_nodes: 300
  minimum_publish: 50
  preserve_last_good: true
  max_per_country: 80
  max_per_region: 120
  max_per_colo: 30
  max_per_ipv4_24: 4
  max_per_ipv6_48: 4
  node_label: country
  write_compatibility_zip: true

vantage:
  # A GitHub-hosted runner is only one network vantage point. For genuine
  # CT/CU/CM measurements, run the same command on self-hosted runners and
  # merge their data under data/probes/.
  name: ${NOODE_VANTAGE:-local-unknown}
  probe_files: []

platform_compatibility:
  # GitHub cannot prove access through your private Worker/Clash chain without
  # its credentials. Anonymous local probe files can enable this strict gate.
  required: false
  minimum_nodes: 50
  minimum_vantages: 1
  required_platforms: [x, telegram, youtube, huggingface, github, google, chatgpt, civitai]
