[project]
name = "noode-cg"
version = "11.2.0"
description = "Cloudflare edge endpoint verifier and edgetunnel feed generator"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.1,<7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF059", "RUF100"]
